  <g fill="none" stroke="#f4f1ea" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <rect x="146" y="166" width="220" height="180" rx="34"/>
    <path d="M211 166v180M266 226h56M266 286h56"/>
  </g>
</svg>
