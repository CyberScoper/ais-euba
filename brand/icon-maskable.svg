<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: full bleed, no corners of its own, and the glyph stays inside the 80%
       safe circle so a round Android mask never clips it. -->
