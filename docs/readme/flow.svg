<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 330" width="1600" height="330" role="img" aria-label="The browser talks to this Node server, which holds the AIS session and talks to ais2.euba.sk">
  <rect width="1600" height="330" fill="#f4f1ea"/>

  <g font-family="'Inter',system-ui,-apple-system,'Segoe UI',sans-serif">
    <!-- browser -->
    <g transform="translate(90 84)">
      <rect width="360" height="162" rx="24" fill="#fbf9f4" stroke="#ddd6c6" stroke-width="2"/>
      <rect x="0" y="0" width="360" height="40" rx="24" fill="#efece3"/>
      <rect x="0" y="24" width="360" height="16" fill="#efece3"/>
      <circle cx="28" cy="20" r="6" fill="#c8bfa9"/><circle cx="50" cy="20" r="6" fill="#c8bfa9"/><circle cx="72" cy="20" r="6" fill="#c8bfa9"/>
      <text x="30" y="92" font-size="26" font-weight="700" fill="#17150f">The PWA</text>
      <text x="30" y="126" font-size="20" fill="#524d40">holds a session cookie,</text>
      <text x="30" y="152" font-size="20" fill="#524d40">never an AIS credential</text>
    </g>

    <!-- arrow 1 -->
    <g stroke="#3a35a8" stroke-width="3" fill="none">
      <path d="M470 165h130"/>
      <path d="M588 154l14 11-14 11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="478" y="146" font-size="18" font-weight="600" fill="#3a35a8">/api/*</text>

    <!-- this server -->
    <g transform="translate(620 60)">
      <rect width="360" height="210" rx="24" fill="#e9e8f7" stroke="#3a35a8" stroke-opacity="0.35" stroke-width="2"/>
      <text x="30" y="58" font-size="26" font-weight="700" fill="#17150f">This Node server</text>
      <text x="30" y="96" font-size="20" fill="#524d40">the AIS session lives here</text>
      <text x="30" y="126" font-size="20" fill="#524d40">pacer · cache · breaker</text>
      <text x="30" y="156" font-size="20" fill="#524d40">read-only allowlist</text>
      <text x="30" y="186" font-size="20" fill="#524d40">password sealed, opt-in</text>
    </g>

    <!-- arrow 2 -->
    <g stroke="#0d6b64" stroke-width="3" fill="none">
      <path d="M1000 165h130"/>
      <path d="M1118 154l14 11-14 11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1004" y="146" font-size="18" font-weight="600" fill="#0d6b64">reads only</text>

    <!-- AIS -->
    <g transform="translate(1150 84)">
      <rect width="360" height="162" rx="24" fill="#dcebe9" stroke="#0d6b64" stroke-opacity="0.32" stroke-width="2"/>
      <text x="30" y="60" font-size="26" font-weight="700" fill="#17150f">ais2.euba.sk</text>
      <text x="30" y="98" font-size="20" fill="#524d40">the university's own</text>
      <text x="30" y="124" font-size="20" fill="#524d40">system, unchanged</text>
    </g>

    <text x="90" y="300" font-size="19" fill="#6f6959">No public API and no CORS: a browser cannot reach AIS directly, so the server does — one instance, one student.</text>
  </g>
</svg>
